[package]
name = "wgmik-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "backup", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
bcrypt = "0.15"
jsonwebtoken = "9.3"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
base64 = "0.22"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rust-embed = { version = "8.4", features = ["interpolate-folder-path"] }
resvg = "0.43"
usvg = "0.43"
tiny-skia = "0.11"
fontdb = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.0"
tar = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
mime_guess = "2.0"
async-trait = "0.1"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
